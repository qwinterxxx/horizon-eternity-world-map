id = "eternity_world_map"
name = "Eternity world map"
version = "0.1.2"
description = "Zero-overhead native minimap, persistent fullscreen world map (M), Cave Mode, mob radar, and 3D waypoints."
authors = ["qwinterx"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "eternity_world_map_bridge"
source = "src/bridge.rs"
visibility = "pub(crate)"

[[native.mixin]]
id = "extras_frame"
target = "horizon_client::game::extras::Game::extras_frame"
kind = "HEAD"
helper = "src/mixins/extras_frame.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
]

[[native.mixin]]
id = "draw_extras"
target = "horizon_client::game::extras::Game::draw_extras"
kind = "HEAD"
helper = "src/mixins/draw_extras.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "self" },
  { name = "batch", ty = "&mut HudBatch", value = "batch" },
]

[[native.mixin]]
id = "hud_layers"
target = "horizon_client::game::Game::hud_layers"
kind = "RETURN"
helper = "src/mixins/hud_layers.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "HudBatch", value = "$value" },
]
